worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format pdfforge '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log pdfforge;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        font/woff2;

    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=pdfforge_static:32m
                     max_size=400m inactive=7d use_temp_path=off;

    limit_req_zone $binary_remote_addr zone=html:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=assets:10m rate=50r/s;

    upstream pdfforge {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
    }

    # Host port 8080 is HTTP in Compose; TLS is 8443. Bare $host would send browsers to 443.
    map $http_host $pdfforge_https {
        default https://$host$request_uri;
        "~*^(.+):8080$" https://$1:8443$request_uri;
    }

    include /etc/nginx/conf.d/*.conf;
}
