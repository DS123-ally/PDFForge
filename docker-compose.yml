x-pdfforge-app: &pdfforge-app
  image: pdfforge:local
  environment:
    NODE_ENV: production
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
  restart: unless-stopped
  expose:
    - "3000"
  mem_limit: 512m
  cpus: "1.0"
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 25s

services:
  app:
    <<: *pdfforge-app
    pull_policy: build
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}

  app2:
    <<: *pdfforge-app
    pull_policy: never
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      app2:
        condition: service_started
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/http.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.5"
